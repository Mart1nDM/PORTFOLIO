    <!-- SCRIPT PARA CONECTAR EL FORMULARIO CON TU BACKEND PYTHON -->
    <script>
        document.getElementById('formulario-contacto').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que la página se recargue
            
            const btn = document.getElementById('btn-enviar');
            const estado = document.getElementById('estado-mensaje');
            
            // Estado de carga
            btn.innerHTML = 'Procesando...<span class="cursor-blink">_</span>';
            btn.disabled = true;
            estado.innerHTML = '';

            // Recolectamos los datos
            const datos = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                mensaje: document.getElementById('mensaje').value
            };

            try {
                // ATENCIÓN: Esta URL es para probarlo en tu computadora. 
                // Cuando subas el backend a Render, cambiarás esto por la URL que te den.
                const respuesta = await fetch('http://127.0.0.1:5000/enviar-correo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                if (respuesta.ok) {
                    estado.innerHTML = '<span class="text-success">> Mensaje enviado exitosamente.</span>';
                    document.getElementById('formulario-contacto').reset();
                } else {
                    estado.innerHTML = '<span class="text-danger">> Error: No se pudo establecer conexión con el servidor.</span>';
                }
            } catch (error) {
                estado.innerHTML = '<span class="text-danger">> Error crítico: Servidor fuera de línea.</span>';
            } finally {
                btn.innerHTML = 'Ejecutar envío_';
                btn.disabled = false;
            }
        });
    </script>
